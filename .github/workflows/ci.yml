name: Remora CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  doc-and-contract-checks:
    name: Verify Docs, Front-Matter & OpenAPI Contracts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify Front-Matter Presence
        run: node scripts/check-docs.js

      - name: Lint OpenAPI Specifications with Spectral
        run: npx -y @stoplight/spectral-cli lint "services/gateway/openapi.yaml" "services/ai-service/openapi.yaml" --fail-severity warn

  android-build-and-test:
    name: Android Build, Lint & Unit Tests
    runs-on: ubuntu-latest
    needs: doc-and-contract-checks
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Core Model Unit Tests
        run: ./gradlew :core:model:test

      - name: Run App Unit Tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Assemble Debug APK
        run: ./gradlew :app:assembleDebug

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: remora-app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

  services-build-and-test:
    name: Backend Services Build & Test
    runs-on: ubuntu-latest
    needs: doc-and-contract-checks
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build and Test Microservices
        run: ./gradlew --project-dir services test assemble
