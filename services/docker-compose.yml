version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: remora-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: remora_db
      POSTGRES_USER: remora_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-remora_pass_secure}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./gateway/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - remora-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U remora_user -d remora_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    container_name: remora-gateway
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      JWT_SECRET: ${JWT_SECRET:-remora_super_secret_jwt_key_hackathon_2026}
      DATABASE_URL: jdbc:postgresql://postgres:5432/remora_db
      DB_USER: remora_user
      DB_PASSWORD: ${DB_PASSWORD:-remora_pass_secure}
      AI_SERVICE_URL: http://ai-service:8082
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY:-remora_internal_mesh_key_2026}
      RATE_LIMIT_PER_MINUTE: 60
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - remora-net

  ai-service:
    build:
      context: .
      dockerfile: ai-service/Dockerfile
    container_name: remora-ai-service
    restart: unless-stopped
    environment:
      PORT: 8082
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_VISION_MODEL: gemini-3.5-flash-lite
      GEMINI_VISION_FALLBACK_MODEL: gemini-3.5-flash
      GEMINI_EMBEDDING_MODEL: gemini-embedding-2
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY:-remora_internal_mesh_key_2026}
    networks:
      - remora-net

volumes:
  postgres_data:

networks:
  remora-net:
    driver: bridge
