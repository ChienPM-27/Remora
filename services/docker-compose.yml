version: '3.8'

services:
  caddy:
    image: caddy:2.8-alpine
    container_name: remora-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-api.remora.study}
      ACME_EMAIL: ${ACME_EMAIL:-admin@remora.study}
    mem_limit: 64m
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - gateway
    networks:
      - remora-net

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    container_name: remora-gateway
    restart: unless-stopped
    mem_limit: 384m
    environment:
      PORT: 8080
      JAVA_OPTS: "-Xms128m -Xmx320m -XX:+UseG1GC"
      JWT_SECRET: ${JWT_SECRET}
      DEMO_USERNAME: ${DEMO_USERNAME}
      DEMO_PASSWORD: ${DEMO_PASSWORD}
      AI_SERVICE_URL: http://ai-service:8082
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY}
    depends_on:
      ai-service:
        condition: service_started
    networks:
      - remora-net

  ai-service:
    build:
      context: .
      dockerfile: ai-service/Dockerfile
    container_name: remora-ai-service
    restart: unless-stopped
    mem_limit: 512m
    environment:
      PORT: 8082
      JAVA_OPTS: "-Xms128m -Xmx384m -XX:+UseG1GC"
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_VISION_MODEL: gemini-3.5-flash-lite
      GEMINI_VISION_FALLBACK_MODEL: gemini-3.5-flash
      GEMINI_EMBEDDING_MODEL: gemini-embedding-2
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY}
    networks:
      - remora-net

volumes:
  caddy_data:
  caddy_config:

networks:
  remora-net:
    driver: bridge
